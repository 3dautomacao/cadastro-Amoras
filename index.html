<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro Facial</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
    margin: 0;
    padding: 10px;
  }

  img.logo {
    width: 40vw;
    max-width: 160px;
    margin: 10px auto;
  }

  input {
    width: 90vw;
    max-width: 320px;
    padding: 10px;
    margin: 6px auto;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
    display: block;
  }

  button {
    width: 60vw;
    max-width: 220px;
    padding: 10px;
    margin: 8px;
    font-size: 15px;
    border-radius: 8px;
    border: none;
    background: #0066cc;
    color: white;
    cursor: pointer;
  }

  .camera-container {
    position: relative;
    width: 90vw;
    max-width: 320px;
    margin: auto;
  }

  video {
    width: 100%;
    border-radius: 12px;
  }

  .face-oval {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 70%;
    height: 90%;
    border: 3px solid #00ff00;
    border-radius: 50% / 60%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .btn-trocar {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    background: rgba(0,0,0,0.7);
    z-index: 10;
  }

  .preview-box {
    width: 90vw;
    max-width: 320px;
    height: 240px;
    margin: 10px auto;
    border: 2px dashed #999;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }

  .preview-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }

  .lgpd {
    background: #fff3cd;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    max-width: 320px;
    margin: auto;
  }
</style>
</head>

<body>

<img src="logo.png" class="logo">

<h3>Cadastro Facial do Morador</h3>

<div class="lgpd" id="lgpdBox">
  Ao enviar sua foto, você autoriza o uso dela para cadastro no sistema de controle de acesso do condomínio.
  <br><br>
  <button onclick="aceitarLGPD()">OK</button>
</div>

<div id="formulario" style="display:none;">

  <input id="nome" placeholder="Nome completo">
  <input id="bloco" placeholder="Bloco">
  <input id="apto" placeholder="Apartamento">

  <div class="camera-container">
    <button class="btn-trocar" onclick="trocarCamera()">Trocar câmera</button>
    <video id="video" autoplay playsinline></video>
    <div class="face-oval"></div>
  </div>

  <button onclick="capturar()">Capturar Foto</button>

  <div class="preview-box">
    <img id="fotoPreview">
  </div>

  <button onclick="enviar()">Finalizar</button>

  <canvas id="canvas" style="display:none;"></canvas>

  <div id="status" style="display:none; font-weight:bold; color:green;">
    Salvando dados, aguarde...
  </div>

</div>

<script>
let usandoFrontal = true;
let streamAtual = null;
let faceMesh;

function aceitarLGPD() {
  document.getElementById("lgpdBox").style.display = "none";
  document.getElementById("formulario").style.display = "block";
  iniciarCamera();
  iniciarFaceMesh();
}

async function iniciarCamera() {
  const video = document.getElementById("video");

  if (streamAtual) {
    streamAtual.getTracks().forEach(track => track.stop());
  }

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: usandoFrontal ? "user" : "environment" }
  });

  streamAtual = stream;
  video.srcObject = stream;
}

function trocarCamera() {
  usandoFrontal = !usandoFrontal;
  iniciarCamera();
}

function iniciarFaceMesh() {
  faceMesh = new FaceMesh({
    locateFile: file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  const video = document.getElementById("video");

  async function detectar() {
    await faceMesh.send({ image: video });
    requestAnimationFrame(detectar);
  }

  detectar();
}

function capturar() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  document.getElementById("fotoPreview").src =
    canvas.toDataURL("image/jpeg");
}

function enviar() {
  const nome = document.getElementById("nome").value;
  const bloco = document.getElementById("bloco").value;
  const apto = document.getElementById("apto").value;

  if (!nome || !bloco || !apto) {
    alert("Preencha todos os campos!");
    return;
  }

  const img = document.getElementById("canvas").toDataURL("image/jpeg");

  document.getElementById("status").style.display = "block";

  fetch("https://script.google.com/macros/s/AKfycbzeUGCpm9bz0VvT-uW19D1RiI_fLi49Baaft6S_mEtl5lPyS86szqxpgaug3FJhG_46/exec", {
    method: "POST",
    body: JSON.stringify({ nome, bloco, apto, img })
  });

  setTimeout(() => location.reload(), 5000);
}
</script>

</body>
</html>
