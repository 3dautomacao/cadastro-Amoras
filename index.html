<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro Facial</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
      padding: 10px;
    }

    img.logo {
      max-width: 320px;
      margin: 10px auto;
    }

    input {
      width: 90%;
      max-width: 320px;
      padding: 8px;
      margin: 6px auto;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      display: block;
    }

    button {
      width: 22%;
      padding: 8px;
      margin: 6px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      background: #0066cc;
      color: white;
      cursor: pointer;
    }

    video {
      width: 240px;
      border-radius: 10px;
    }

    .camera-container {
      position: relative;
      display: inline-block;
    }

    .face-oval {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 160px;
      height: 240px;
      border: 3px solid #00ff00;
      border-radius: 50% / 60%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .btn-trocar {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      font-size: 13px;
      padding: 6px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border-radius: 8px;
      z-index: 10;
    }

    .info {
      background: #e0f0ff;
      padding: 8px;
      border-radius: 6px;
      margin: 8px auto;
      font-size: 13px;
      width: 90%;
      max-width: 320px;
    }

    .lgpd {
      background: #fff3cd;
      padding: 10px;
      border-radius: 8px;
      margin: 10px auto;
      font-size: 13px;
      width: 90%;
      max-width: 320px;
    }

    #preview {
      display: none;
      margin-top: 10px;
    }

    #status {
      display: none;
      font-weight: bold;
      color: green;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <img src="logo.png" class="logo">

  <h3>Cadastro Facial do Morador</h3>

  <div class="lgpd" id="lgpdBox">
    Ao enviar sua foto, você autoriza o uso dela para cadastro no sistema de controle de acesso do condomínio.
    <br><br>
    <button onclick="aceitarLGPD()">OK</button>
  </div>

  <div id="formulario" style="display:none;">

    <input id="nome" placeholder="Nome completo">
    <input id="bloco" placeholder="Bloco">
    <input id="apto" placeholder="Apartamento">

    <div class="info" id="mensagem">
      Posicione seu rosto dentro do oval.
    </div>

    <div class="camera-container">

      <button class="btn-trocar" onclick="trocarCamera()">Trocar câmera</button>

      <video id="video" autoplay playsinline></video>
      <div class="face-oval"></div>

    </div>

    <br>
    <button onclick="capturar()">Capturar</button>

    <canvas id="canvas" style="display:none;"></canvas>

    <div id="preview">
      <h4>Prévia da Foto</h4>
      <img id="fotoPreview" style="width:260px; border-radius:10px;">
      <br><br>
      <button onclick="enviar()">Finalizar</button>
    </div>

    <div id="status">Salvando dados, aguarde...</div>

  </div>

  <script>
    let stream;
    let usandoFrontal = true;

    function aceitarLGPD() {
      document.getElementById("lgpdBox").style.display = "none";
      document.getElementById("formulario").style.display = "block";
      iniciarCamera();
    }

    async function iniciarCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());

      const constraints = {
        video: { facingMode: usandoFrontal ? "user" : "environment" }
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById("video").srcObject = stream;
    }

    function trocarCamera() {
      usandoFrontal = !usandoFrontal;
      iniciarCamera();
    }

    function capturar() {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      // Verificação de brilho (qualidade básica)
      const imgData = canvas.getContext("2d").getImageData(0,0,canvas.width,canvas.height);
      let brilho = 0;
      for (let i = 0; i < imgData.data.length; i += 4) {
        brilho += (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
      }
      brilho = brilho / (imgData.data.length / 4);

      if (brilho < 60) {
        alert("Imagem muito escura. Melhore a iluminação.");
        return;
      }

      // Verificação de posição do rosto (simples)
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (cy < canvas.height * 0.3 || cy > canvas.height * 0.7) {
        alert("Posicione melhor o rosto dentro do oval.");
        return;
      }

      const img = canvas.toDataURL("image/jpeg");
      document.getElementById("fotoPreview").src = img;
      document.getElementById("preview").style.display = "block";

      document.getElementById("mensagem").innerText =
        "Confira a foto antes de finalizar.";
    }

    function enviar() {
      const nome = document.getElementById("nome").value;
      const bloco = document.getElementById("bloco").value;
      const apto = document.getElementById("apto").value;

      if (!nome || !bloco || !apto) {
        alert("Preencha todos os campos!");
        return;
      }

      const img = document.getElementById("canvas").toDataURL("image/jpeg");

      document.getElementById("status").style.display = "block";

      fetch("https://script.google.com/macros/s/AKfycbzeUGCpm9bz0VvT-uW19D1RiI_fLi49Baaft6S_mEtl5lPyS86szqxpgaug3FJhG_46/exec", {
        method: "POST",
        body: JSON.stringify({ nome, bloco, apto, img })
      });

      setTimeout(() => {
        location.reload();
      }, 5000);
    }
  </script>

</body>
</html>
